<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#0f0f23" stroke="#64ffda" stroke-width="2.5"/>

  <!-- Accent Agile Pulse Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#64ffda" filter="url(#glow)"/>

  <!-- Monogram NR -->
  <text x="32" y="42" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="25" 
        font-weight="800" 
        fill="url(#tealGrad)" 
        text-anchor="middle" 
        letter-spacing="-1.5">NR</text>

  <!-- Bottom Accent Line -->
  <rect x="20" y="49" width="24" height="2.5" rx="1.25" fill="#64ffda" opacity="0.8"/>
</svg>
